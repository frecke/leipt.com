name: Build site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Hugo Extended
        run: |
          curl --fail --location --silent --show-error -o hugo.tar.gz https://github.com/gohugoio/hugo/releases/download/v0.167.0/hugo_extended_0.167.0_linux-amd64.tar.gz
          tar -xzf hugo.tar.gz hugo
          sudo install -m 0755 hugo /usr/local/bin/hugo
          hugo version
      - name: Build
        run: hugo --minify --panicOnWarning
      - name: Check generated pages
        run: |
          test -s public/index.html
          test -s public/sitemap.xml
          test -s public/index.xml
          test -s public/contact/index.html
