name: Deploy one.com preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onecom-preview
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: onecom-preview
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - name: Install locked Python dependencies
        run: just setup
      - name: Build isolated preview
        run: just preview
      - name: Check output
        run: |
          test -s public-preview/index.html
          test -s public-preview/sitemap.xml
      - name: Upload to marked preview directory
        env:
          ONECOM_SFTP_HOST: ${{ secrets.ONECOM_SFTP_HOST }}
          ONECOM_SFTP_PORT: ${{ secrets.ONECOM_SFTP_PORT }}
          ONECOM_SFTP_USER: ${{ secrets.ONECOM_SFTP_USER }}
          ONECOM_SFTP_PASSWORD: ${{ secrets.ONECOM_SFTP_PASSWORD }}
          ONECOM_SFTP_KNOWN_HOSTS: ${{ secrets.ONECOM_SFTP_KNOWN_HOSTS }}
        run: uv run --locked python scripts/deploy_preview.py
