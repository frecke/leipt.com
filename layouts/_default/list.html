{{ define "main" }}
  <section class="page-content">
    <p class="eyebrow">leipt.com / {{ .Section }}</p>
    <h1>{{ .Title }}</h1>
    <div class="prose">{{ .Content }}</div>
    {{ with .RegularPages }}
      <div class="entries" aria-label="{{ $.Title }} entries">
        {{ range .ByDate.Reverse }}<article class="entry"><p class="entry-date"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan 2006" }}</time></p><h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>{{ with .Description }}<p>{{ . }}</p>{{ end }}</article>{{ end }}
      </div>
    {{ end }}
  </section>
{{ end }}
