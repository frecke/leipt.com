[project]
name = "leipt-site-tools"
version = "0.1.0"
description = "Development and preview deployment tools for leipt.com"
requires-python = ">=3.14,<3.15"
dependencies = ["paramiko==3.5.1"]

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff>=0.13,<1"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
